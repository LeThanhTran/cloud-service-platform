services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: novacloud-sqlserver-prod
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Express"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env.production}"
    volumes:
      - novacloud_prod_sql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/1433'"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks:
      - novacloud-prod-network

  api:
    build:
      context: .
      dockerfile: backend/CloudService.WebApi/Dockerfile
    container_name: novacloud-api-prod
    restart: unless-stopped
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=CloudServiceDb;User Id=sa;Password=${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env.production};TrustServerCertificate=True;MultipleActiveResultSets=True"
      Frontend__BaseUrl: "${PUBLIC_BASE_URL:?Set PUBLIC_BASE_URL in .env.production}"
      Jwt__Key: "${JWT_KEY:?Set JWT_KEY in .env.production}"
      Database__ApplyMigrationsOnStartup: "true"
      Database__SeedDemoUsers: "${SEED_DEMO_USERS:-true}"
      DemoUsers__Password: "${DEMO_USERS_PASSWORD:?Set DEMO_USERS_PASSWORD in .env.production}"
      Email__Enabled: "false"
      Swagger__Enabled: "false"
      Security__UseHttpsRedirection: "false"
      ReverseProxy__Enabled: "true"
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 35s
    volumes:
      - novacloud_prod_news_uploads:/app/wwwroot/uploads/news
    networks:
      - novacloud-prod-network

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ""
    container_name: novacloud-frontend-prod
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 25s
    networks:
      - novacloud-prod-network

  nginx:
    image: nginx:1.27-alpine
    container_name: novacloud-nginx-prod
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./deployment/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - novacloud-prod-network

volumes:
  novacloud_prod_sql_data:
  novacloud_prod_news_uploads:

networks:
  novacloud-prod-network:
    driver: bridge
