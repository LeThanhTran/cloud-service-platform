name: Trigger auto deployment for novacloud-frontend

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/novacloud-frontend-AutoDeployTrigger-4bbaa960-a270-4c29-a2ec-17edeb9b16f7.yml"

  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.NOVACLOUDFRONTEND_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.NOVACLOUDFRONTEND_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.NOVACLOUDFRONTEND_AZURE_SUBSCRIPTION_ID }}

      - name: Build, push and deploy frontend
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          dockerfilePath: frontend/Dockerfile
          registryUrl: docker.io
          registryUsername: ${{ secrets.NOVACLOUDFRONTEND_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.NOVACLOUDFRONTEND_REGISTRY_PASSWORD }}
          containerAppName: novacloud-frontend
          resourceGroup: rg-novacloud
          imageToBuild: docker.io/lethanhtran/novacloud-frontend:${{ github.sha }}
          buildArguments: |
            NEXT_PUBLIC_API_BASE_URL=https://novacloud-api.agreeablebeach-d983f9c2.southeastasia.azurecontainerapps.io