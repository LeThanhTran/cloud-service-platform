name: NovaCloud CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend - Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore Web API
        run: dotnet restore backend/CloudService.WebApi/CloudService.WebApi.csproj

      - name: Restore Tests
        run: dotnet restore backend/CloudService.Tests/CloudService.Tests.csproj

      - name: Build Web API
        run: dotnet build backend/CloudService.WebApi/CloudService.WebApi.csproj --configuration Release --no-restore

      - name: Build Tests
        run: dotnet build backend/CloudService.Tests/CloudService.Tests.csproj --configuration Release --no-restore

      - name: Run unit tests with coverage
        run: >
          dotnet test backend/CloudService.Tests/CloudService.Tests.csproj
          --configuration Release
          --no-build
          --collect:"XPlat Code Coverage"
          --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/CloudService.Tests/TestResults/
          if-no-files-found: warn

  frontend:
    name: Frontend - Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build

  docker:
    name: Docker - Validate & Build
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
    env:
      MSSQL_SA_PASSWORD: "NovaCloudCI@2026Strong!"
      DEMO_USERS_PASSWORD: "123456"
      JWT_KEY: "NovaCloud_CI_Only_JWT_Key_AtLeast_32_Characters_Long_2026"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: docker compose config

      - name: Build Web API image
        run: docker compose build api
